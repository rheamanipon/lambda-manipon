
service: serverless-payroll-api

provider:
  name: aws
  region: ap-southeast-2
  stage: dev
  environment:
    S3_BUCKET: payroll-payslips-rhea-2026
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - s3:PutObject
          Resource:
            - arn:aws:s3:::payroll-payslips-rhea-2026/payslips/*

plugins:
  - ./vendor/bref/bref

functions:
  api:
    handler: public/index.php
    runtime: php-84-fpm
    timeout: 28
    memorySize: 512
    events:
      - httpApi: '*'
